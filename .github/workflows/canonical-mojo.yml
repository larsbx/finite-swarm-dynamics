name: Pinned Mojo chromogeometry consumer
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-mojo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: larsbx/finite-math-kernels
          ref: 8fc4c7b3e0f7bb643a38124c99af9c397a868650
          path: .cache/finite-math-kernels
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: .cache/finite-math-kernels/pixi.toml
      - name: Check canonical upstream revision
        run: |
          python - <<'PY'
          import pathlib, subprocess, tomllib
          spec = tomllib.loads(pathlib.Path("UPSTREAM.toml").read_text())["finite_math_kernels"]
          assert spec["repository"] == "larsbx/finite-math-kernels"
          found = subprocess.check_output(
              ["git", "-C", ".cache/finite-math-kernels", "rev-parse", "HEAD"],
              text=True
          ).strip()
          assert found == spec["commit"], (found, spec["commit"])
          print("verified upstream pin", found)
          PY
      - name: Exercise canonical Mojo chromogeometry
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel \
            tests/mojo/chromogeometry_consumer.mojo
      - name: Verify compiled Mojo finite alignment
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_linear_alignment.mojo
      - name: Exhaustive Mojo/Python alignment conformance over F_7^3
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/alignment_conformance.mojo > "$RUNNER_TEMP/alignment_F7.txt"
          python -m tools.check_alignment_conformance "$RUNNER_TEMP/alignment_F7.txt"
      - name: Verify compiled finite Vicsek and Kuramoto analogues
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_finite_phase.mojo
      - name: Exact compiled phase and modal differential conformance over F_7
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/phase_conformance.mojo > "$RUNNER_TEMP/phase_F7.txt"
          python -m tools.check_phase_conformance "$RUNNER_TEMP/phase_F7.txt"
          python -m tools.phase_orbit_census "$RUNNER_TEMP/phase_F7.txt"
      - name: Verify actual blue/red/green compiled neighborhoods
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_chromatic_neighborhoods.mojo
      - name: Verify exact batched Mojo parity and atomic refusal
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_batched_alignment.mojo
      - name: Complete finite F7 coupling stratification
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/coupling_strata.mojo > "$RUNNER_TEMP/coupling_F7.txt"
          python -m tools.coupling_stratification "$RUNNER_TEMP/coupling_F7.txt"
      - name: Exact rational geometry and ordered consensus through canonical QField
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_rational_foundation.mojo
      - name: Verify exact rational N-agent variance certificates
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_rational_variance.mojo
      - name: Verify finite-field leader homology image certificates
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_leader_coverage.mojo

      - name: Verify projective swarm cells and exact cellular topology
        run: |
          pixi run --manifest-path .cache/finite-math-kernels/pixi.toml \
            mojo run -I .cache/finite-math-kernels/kernel -I kernel \
            tests/mojo/test_projective_cells.mojo
